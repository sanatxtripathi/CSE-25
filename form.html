<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking Form</title>
    <style>
        body{background-color: rgb(136, 157, 173);}
        h1{color: blue;}
        
          </style>
</head>
<body;>
   <h1 align="center">Hotel Room Booking Form</h1> 
<form action="#" method="post" align="center"> 
<!-- Name --> 
<label for="fullname">Full Name:</label> 
<input type="text" id="fullname" name="fullname" required> 
<br><br>
<label for="Email Id">Email ID:</label> 
<input type="text" required> 
<br><br> 
<label for="Phone NO">Phone NO:</label> 
<input type="text" required> 
<br><br> 
<label for="Email Id">Check In </label> 
<input type="date" required> 

<br><br> 
<label for="Check out">Check out:</label> 
<input type="date" required> 
<br><br>                                                                                     
<label for="Check out">Check out:</label> 
<input type="" required> 
<br><br>
 <!-- Room Type --> 
        <label for="room">Room Type:</label> 
        <select id="room" name="room"> 
            <option value="single">Single Room</option> 
            <option value="double">Double Room</option> 
            <option value="deluxe">Deluxe Room</option>
             <option value="single">Single Ac Room</option> 
            <option value="double">Double Ac Room</option> 
            <option value="deluxe">Deluxe Ac Room</option>
            <option value="suite">Suite</option> 
        </select> 
        <br><br> 
 
        <!-- Number of Guests --> 
        <label for="guests">Number of Guests:</label> 
        <input type="number" id="guests" name="guests" min="1" max="10"> 
        <br><br> 
 
        <!-- Special Requests --> 
        <label for="requests">Special Requests:</label><br> 
        <textarea id="requests" name="requests" rows="4" cols="40"></textarea> 
        <br><br>
        </form>
</body>
</html>
